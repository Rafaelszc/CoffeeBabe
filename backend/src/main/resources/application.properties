spring.application.name=backend
# Dev-only defaults; real values come from the environment (SEC-14, .env in Docker Compose)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/coffeebabe}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.flyway.baseline-on-migrate=true
spring.flyway.schemas=public
# no default on purpose: a known secret would let anyone sign an ADMIN token (32+ bytes, see .env.example)
security.jwt.token=${JWT_SECRET}
security.jwt.token.expirationMinutes=15
# refresh tokens in Redis (ADR-0008); outside Docker: a local redis-server
security.refresh-token.ttl-days=7
security.refresh-token.reuse-grace-seconds=30
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
# true only behind HTTPS
security.jwt.cookie-secure=${JWT_COOKIE_SECURE:false}
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5174}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
# product images: 2 MB per file (SEC-13)
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
# sign-in/sign-up limits (SEC-5): requests per IP and failed sign-ins per email, per window
app.auth.max-attempts-per-ip=${AUTH_MAX_ATTEMPTS_PER_IP:30}
app.auth.max-failures-per-email=${AUTH_MAX_FAILURES_PER_EMAIL:5}
app.auth.attempt-window-minutes=15

spring.application.name=backend
# Dev-only defaults; real values come from the environment (SEC-14, .env in Docker Compose)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/coffeebabe}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.flyway.baseline-on-migrate=true
spring.flyway.schemas=public
security.jwt.token=${JWT_SECRET:dev-only-change-me-dev-only-change-me}
security.jwt.token.expirationHours=3
# true only behind HTTPS
security.jwt.cookie-secure=${JWT_COOKIE_SECURE:false}
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5174}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
# product images: 2 MB per file (SEC-13)
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
